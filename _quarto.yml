project:
  type: website

brand:
  light: _brand/_brand.yml
  dark: _brand/_brand-dark.yml

website:
  title: "openwashdata"
  site-url: https://openwashdata.org/
  description: "Website of the openwashdata community"
  favicon: _brand/logos/OWD-logo-40.png
  page-navigation: true
  search: false
  page-footer: 
    left: | 
        This project was supported by the 
        [Open Research Data Program of the ETH Board](https://ethrat.ch/en/eth-domain/open-research-data/)
    right:
      - text: About
        href: about.qmd
      - icon: "envelope-at"
        href: "mailto:ghe@mavt.ethz.ch?subject=openwashdata support"
        aria-label: Email
      - icon: github
        href: https://github.com/openwashdata
        aria-label: GitHub
      - icon: chat-left-dots
        href: https://matrix.to/#/#openwashdata-lobby:staffchat.ethz.ch
        aria-label: Matrix
        
  navbar:
    background: primary
    title: false
    logo: "_brand/logos/OWD-logo-16.png"
    logo-alt: "openwashdata"
    collapse-below: lg
    left:
      - text: " "
        href: index.qmd
      - text: "About"
        href: about.qmd
      - text: "Get Started"
        href: pages/get-started/index.qmd
      - text: "Data"
        href: pages/gallery/data/index.qmd
      - text: "Academy"
        menu: 
          - text: "Courses"
            href: pages/academy/index.qmd
          - text: "Graduates 2024"
            href: pages/academy/graduates-2024/index.qmd
          - text: "Graduates 2026"
            href: pages/academy/graduates-2026/index.qmd
      - text: "Gallery"
        href: pages/gallery/
      - text: "Events"
        href: pages/events/index.qmd
      - text: "Blog"
        href: pages/blog/index.qmd
      - text: "Partners"
        href: pages/partners/index.qmd
      - text: "Support"
        menu:
          - text: "Email us"
            icon: "envelope-at"
            href: "mailto:ghe@mavt.ethz.ch?subject=openwashdata support"
          - text: "Report a Bug"
            icon: "bug"
            href: "https://github.com/openwashdata/book/issues"
          - text: "Donate data"
            icon: "clipboard-data"
            href: "https://github.com/openwashdata/data/issues"

    right:
      - text: Code of Conduct
        href: code_of_conduct.qmd
      - icon: envelope-at-fill
        href: "mailto:ghe@mavt.ethz.ch?subject=openwashdata support"
        aria-label: Email
      - icon: github
        href: https://github.com/openwashdata
        aria-label: GitHub

  sidebar:
    - id: get-started
      title: "Get Started"
      logo: false
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - pages/get-started/index.qmd
        - text: "Chat"
          href: pages/get-started/chat/index.qmd
          
    - id: gallery
      title: "Gallery"
      logo: false
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - text: "Data"
          href: pages/gallery/data/index.qmd
        - text: "VMOST"
          href: pages/gallery/vmost/index.qmd
        - text: "Stats"
          href: pages/gallery/stats/index.qmd
        - text: "Slides"
          href: pages/gallery/slides/
        - text: "Phase 1 Proposal"
          href: pages/gallery/proposal/index.qmd
        - text: "Phase 2 Proposal"
          href: pages/gallery/proposal-02/index.qmd
        
format:
  html:
    theme:
      light: [litera, brand, style/theme.scss]
      dark: [litera, brand, style/theme-dark.scss]
    highlight-style: a11y-dark
    css: styles.css
    code-copy: true
    code-overflow: wrap
    link-external-icon: true
    link-external-newwindow: true
    toc: true
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 300px
    include-in-header: 
        - text: |
            <script defer data-domain="openwashdata.org" src="https://plausible.io/js/script.js"></script>

execute: 
  freeze: auto
